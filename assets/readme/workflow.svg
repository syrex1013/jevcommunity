<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">How JevCommunity answers typed questions</title>
  <desc id="desc">Three-step flow: shared state plus parallel questions, one prefill pass on Kev-0.8B with MLX, typed answers with probabilities and confidence.</desc>
  <rect width="1200" height="280" rx="24" fill="#0A1220"/>
  <rect x="20" y="20" width="1160" height="240" rx="18" fill="none" stroke="#243149" stroke-width="1.5"/>

  <!-- step 1 -->
  <rect x="48" y="56" width="300" height="168" rx="16" fill="#121B2D" stroke="#2C3B57" stroke-width="1.5"/>
  <text x="72" y="96" fill="#6FE7D4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">1 · STATE + QUESTIONS</text>
  <text x="72" y="132" fill="#F5F8FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">One ticket, many asks</text>
  <text x="72" y="164" fill="#8B95A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">choice · score · noul</text>
  <text x="72" y="194" fill="#8B95A8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Questions stay independent</text>

  <!-- arrow -->
  <path d="M370 140 H430" stroke="#3EE0C9" stroke-width="3" stroke-linecap="round"/>
  <path d="M418 128 L436 140 L418 152" fill="none" stroke="#3EE0C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 2 -->
  <rect x="450" y="56" width="300" height="168" rx="16" fill="#121B2D" stroke="#2C3B57" stroke-width="1.5"/>
  <text x="474" y="96" fill="#F0B429" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">2 · ONE PREFILL PASS</text>
  <text x="474" y="132" fill="#F5F8FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Kev-0.8B on MLX</text>
  <text x="474" y="164" fill="#8B95A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">pointer head · no chat</text>
  <text x="474" y="194" fill="#8B95A8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Fits Mac mini M4 16GB</text>

  <path d="M772 140 H832" stroke="#3EE0C9" stroke-width="3" stroke-linecap="round"/>
  <path d="M820 128 L838 140 L820 152" fill="none" stroke="#3EE0C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- step 3 -->
  <rect x="852" y="56" width="300" height="168" rx="16" fill="#121B2D" stroke="#2C3B57" stroke-width="1.5"/>
  <text x="876" y="96" fill="#7EB6FF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">3 · TYPED ANSWERS</text>
  <text x="876" y="132" fill="#F5F8FC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">Code can act on them</text>
  <text x="876" y="164" fill="#8B95A8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">probs · confidence</text>
  <text x="876" y="194" fill="#8B95A8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">TypeSafe SDK works</text>
</svg>
